name: Build Desktop Apps (Windows, Linux, macOS)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fuse libfuse2

      - name: Install NPM Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Application
        working-directory: ./web
        run: npm run build

      - name: Build Desktop Binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: ./web
        run: npx electron-builder --win --publish never

      - name: Build Desktop Binaries (Linux)
        if: runner.os == 'Linux'
        working-directory: ./web
        run: npx electron-builder --linux --publish never

      - name: Build Desktop Binaries (macOS)
        if: runner.os == 'macOS'
        working-directory: ./web
        run: npx electron-builder --mac --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vynce-desktop-${{ runner.os }}
          path: |
            web/release-desktop/*.exe
            web/release-desktop/*.AppImage
            web/release-desktop/*.deb
            web/release-desktop/*.dmg
            web/release-desktop/*.zip
          if-no-files-found: warn
